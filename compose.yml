services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: segfox_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d segfox_development" ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${SEGFOX_DOCKER_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
